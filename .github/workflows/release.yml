name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Executable
        run: |
          dotnet publish "Downloader/Universal Downloader.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-win/

      - name: Sign Executable & Package Zip
        shell: pwsh
        run: |
          # 1. Create a code-signing certificate for Authenticode
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=astymic, O=UniversalDownloader" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5)
          $pfxPassword = ConvertTo-SecureString "UniversalDownloader" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "codesign.pfx" -Password $pfxPassword

          # 2. Find signtool.exe and sign binary with RFC 3161 timestamp
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          if ($signtool) {
            Write-Host "Signing binary using: $signtool"
            & $signtool sign /f "codesign.pfx" /p "UniversalDownloader" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Universal Downloader" "publish-win\Universal Downloader.exe"
          } else {
            Write-Warning "signtool.exe not found; signing skipped."
          }

          # 3. Create zip package and duplicate for compatibility
          Copy-Item "publish-win\Universal Downloader.exe" "publish-win\Universal.Downloader.exe"
          Compress-Archive -Path "publish-win\Universal Downloader.exe" -DestinationPath "publish-win\UniversalDownloader-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: |
            publish-win/Universal Downloader.exe
            publish-win/Universal.Downloader.exe
            publish-win/UniversalDownloader-windows-x64.zip

  build-linux:
    name: Build Linux Executable & Arch Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Linux Executable
        run: |
          dotnet publish "Downloader.Avalonia/Downloader.Avalonia.csproj" -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish-linux/
          chmod +x "publish-linux/Universal Downloader"
          tar -czvf UniversalDownloader-linux-x64.tar.gz -C publish-linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: |
            UniversalDownloader-linux-x64.tar.gz
            packaging/linux/PKGBUILD
            packaging/linux/universal-downloader.desktop

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: release-assets/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Universal Downloader ${{ github.ref_name }} — Official Cross-Platform Release"
          files: release-assets/*
          body: |
            ## 🚀 Universal Downloader ${{ github.ref_name }}

            A modern, fast, multi-platform media downloader, converter, and audio identification workstation for **Windows** and **Linux**.

            ### ✨ What's New in ${{ github.ref_name }}:
            * 📂 **Google Drive Shared Folder Downloader & Interactive Structure Explorer** — Full support for public Google Drive shared folders with multi-level subfolders. Features an interactive folder tree drawer with tri-state selection checkboxes, live file and recursive folder sizes, dynamic total download size calculator, "Download All" and "Download Selected" actions, routing to download queue with per-file progress tracking (speed/ETA/percentage), automatic large-file (>100MB) virus scan bypass, concurrent folder crawling, and 1:1 disk structure preservation.
            * 🎥 **Full YouTube Video Qualities Restored (4K, 1440p, 1080p, 720p, 480p, 360p)** — Fixed video quality dropdown restricting formats to 360p by introducing a smart primary/fallback client architecture that fetches all high-resolution streams for standard videos while preserving full compatibility for restricted and kids content.
            * 🎨 **Interactive Text Label Studio for GIF & WebP** — Add and customize text overlays directly on videos with movable labels, 8-point drag-and-drop resize handles, auto-deletion of empty labels, and dedicated cursor / text selection tools.
            * 🌈 **Circular Spectrum Color Picker** — Full-spectrum hue/saturation color wheel with high-resolution visual indicator, dedicated vertical brightness slider, live preview swatch, and precise Hex/RGB inputs.
            * 🎛️ **Zero-Shift Top Formatting Ribbon & Symmetrical Studio Frame** — Integrated solid ribbon for font family, size (pt), bold, italic, underline, and strikethrough with locked dimensions that prevent layout jumps, framed symmetrically by the left tool picker and matching right border.
            * 🔧 **YouTube Download Fix for Long & Unicode Titles (MAX_PATH & Errno 2)** — Resolved the `[Errno 2] No such file or directory` crash occurring when downloading YouTube videos with long titles, styled Unicode fonts (e.g. mathematical bold), or non-ASCII characters. The downloader now uses `-P` directory scoping, `--trim-filenames 60`, `--windows-filenames`, short temporary folder naming, and `longPathAware` application manifest to strictly stay within Windows file path limits.
            * 🤫 **Completely Silent Auto-Updater (No CMD Window)** — Fixed the black CMD console window popping up after an update. Updates now apply seamlessly via a hidden background process with `-WindowStyle Hidden`, preventing any terminal window or console flash from showing even when administrator elevation is required for `Program Files`.
            * 🎞️ **GIF, WebP & Telegram Video Sticker Studio** — Create animated GIFs with two-pass adaptive palettegen, animated lossy/lossless WebP, and official Telegram Video Stickers (`.webm` VP9 512x512 <=256KB) with an interactive visual crop box and 4K lightweight proxy preview engine.
            * ⏻ **Automated Power Management (Shutdown / Sleep / Hibernate)** — Automatic PC action on completion across Download Queue, Media Converter, and Smart Video Compressor with a 60-second safety countdown dialog and instant cancel button.
            * 🛡️ **Corporate PC & UIPI Drag-and-Drop Fix** — Added explicit `asInvoker` application manifest, automatic removal of Windows PCA `RUNASADMIN` registry shims, `%LOCALAPPDATA%` dependency fallback for read-only folders, and Win32 UIPI message filter bypass so Drag-and-Drop works seamlessly even under Administrator elevation.
            * 🗜️ **Smart Video Compressor** — High-performance video compression with visually lossless defaults (`CRF 20`), target file size optimizer (e.g. Discord 25MB), and custom parameter presets.
            * ⚡ **GPU & CPU Hardware Acceleration** — Accelerated encoding with NVIDIA NVENC, Intel QSV, and AMD AMF (defaulting to GPU), with automatic runtime detection and seamless CPU software fallback.
            * 📋 **Multi-File Batch Queue & Live ETA** — Batch drag-and-drop and multi-selection, real-time \"Time Left\" countdown for active files and batch, and completed time spent tracking.
            * 📁 **Smart Output Folder Organization** — Automatically exports compressed videos into a dedicated `Compressed/` subfolder at source with original filenames preserved, plus optional manual path selection.
            * 🛑 **Instant Process Tree Termination & Cleanup** — Deleting an active video or stopping compression immediately kills the underlying ffmpeg process tree (with `taskkill` fallback) and cleans up partial files without interrupting the rest of the queue.
            * 🎬 **Alloha Player 1080p Support** — High-definition stream decryption with built-in V8 engine resolver and automatic stream header injection.
            * 🛡️ **Organization PC & SmartScreen Protection** — Authenticode digital signing with RFC 3161 timestamping, automatic Zone.Identifier unblocking, and ZIP package distribution.
            * 🔄 **Enhanced Auto-Updater** — Toggle auto-updates on/off in Settings, automatic rollback backup (`.bak`), and seamless restart.

            ---

            ### 📦 Downloads:
            * 🪟 **Windows Portable**: `Universal Downloader.exe`
            * 🪟 **Windows ZIP Archive**: `UniversalDownloader-windows-x64.zip`
            * 🐧 **Linux (Generic / Ubuntu / Debian / Fedora)**: `UniversalDownloader-linux-x64.tar.gz`
            * 🏹 **Arch Linux / Manjaro**: Use the included `PKGBUILD` (`makepkg -si`)

            ---

            ### 🛡️ Windows Security & Corporate / Organization PCs:
            If Windows SmartScreen shows *"Windows protected your PC"* on download:
            1. **Unblock**: Right-click `Universal Downloader.exe` ➔ **Properties** ➔ Check **Unblock** at the bottom ➔ Click **Apply/OK**.
            2. **PowerShell**:
               ```powershell
               Unblock-File -LiteralPath ".\Universal Downloader.exe"
               ```
            3. **Corporate Network**: If your organization blocks `.exe` downloads directly, download `UniversalDownloader-windows-x64.zip`.
            4. **Auto-Updater**: In **Settings ➔ APPLICATION UPDATES**, you can toggle *Check for updates automatically on startup* on/off if your PC requires locally compiled builds.
          generate_release_notes: false
          draft: false
          prerelease: false
